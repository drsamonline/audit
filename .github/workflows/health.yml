name: health

# Asks the fleet whether it still works, every day, and publishes the answer as a
# page so nobody has to read a log to find out.
#
# WHY THIS EXISTS: refresh.yml died on exit 126 and the dashboard showed day-old
# data under a green light. Every scheduled job in this fleet can fail quietly the
# same way. This is the job that notices.
#
# The page is docs/index.html; the machine-readable copy is docs/health.json.

on:
  schedule:
    - cron: "43 3 * * *"   # daily 03:43 UTC - clear of every other cron
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - "tools/**"
      - ".github/workflows/health.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No hard requirement on a cross-repo secret: a token that can read public
      # repositories is enough for every check here, and the built-in token is
      # exactly that. AUDIT_TOKEN is used when present because it also covers
      # private repos (forge, registry, knowledge) - those are skipped otherwise.

      - name: Is the token there?
        env:
          T: ${{ secrets.AUDIT_TOKEN }}
        run: |
          # Never print the value - only whether it exists and how long it is, which
          # is enough to tell "secret missing" apart from "secret present but too narrow".
          if [ -z "$T" ]; then
            echo "::warning::AUDIT_TOKEN is NOT set in this repository - falling back to the built-in token, which cannot read private repos"
          else
            echo "AUDIT_TOKEN is set (${#T} characters)"
          fi

      - name: Ask the fleet
        env:
          GH_TOKEN: ${{ secrets.AUDIT_TOKEN || github.token }}
        run: |
          # A red verdict is still a result worth publishing, so the step does not
          # fail here - the job fails at the end, after the page is live.
          python3 tools/fleet_health.py || echo "health check reported problems"

      - name: Commit the page
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "chore(health): refresh the fleet health page [skip ci]"
          # Another commit can land while this job runs - the first attempt at this
          # workflow failed exactly that way. Rebase and retry rather than losing
          # the page to a race.
          for i in 1 2 3 4; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push attempt $i rejected, retrying"
            sleep $((i * 3))
          done
          echo "::error::could not push the health page after 4 attempts"
          exit 1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Fail if the fleet has a real problem
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("docs/health.json"))
          print("verdict:", d["verdict"])
          problems = []
          for s in d["schedules"]:
              if s["state"] in ("failing", "stale"):
                  problems.append("schedule %s/%s is %s" % (s["repo"], s["workflow"], s["state"]))
          for g in d["generated"]:
              if g["state"] in ("stale", "missing"):
                  problems.append("file %s/%s is %s" % (g["repo"], g["path"], g["state"]))
          for p in problems:
              print("  PROBLEM", p)
          for n in d.get("notes") or []:
              print("  note:", n)
          # Blindness is reported on the page and in the notes, but it is not a
          # fault: failing here would mean a permanently red job for a missing
          # optional secret, and a red X that always shows is a red X nobody reads.
          sys.exit(1 if problems else 0)
          PY
